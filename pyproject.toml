[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ofa-tr"
version = "0.1.0"
description = "On-the-fly adaptation of Turkish language models on the THD-Temporal news stream"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
